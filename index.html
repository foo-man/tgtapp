<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>今日の3つのいいこと 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#f4fbf6;
  --bg-2:#ffffff;
  --accent-1:#66c08a;
  --accent-2:#4aa36a;
  --muted:#6b806f;
  --card-shadow: 0 10px 30px rgba(32,50,40,0.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  font-family: 'Noto Sans JP', system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: linear-gradient(180deg,var(--bg-1) 0%, var(--bg-2) 100%);
  color:#24362b; margin:0; padding:1rem; -webkit-font-smoothing:antialiased;
}

/* レイアウト等（元のスタイルを保持） */
.container{max-width:980px;margin:0 auto;padding-bottom:3rem}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;margin-bottom:12px;background:linear-gradient(180deg,#fff,#fbfffb);box-shadow:var(--card-shadow)}
.app-title{display:flex;align-items:center;gap:10px}
.app-title h1{font-size:1.05rem;margin:0;color:var(--accent-2)}
.stats{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:0.9rem}

/* card */
.card{background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.98));border-radius:14px;padding:12px;box-shadow:var(--card-shadow);margin:0}

/* tabs top */
.tab-nav { display:flex; gap:8px; margin-bottom:12px; }
.tab-btn {
  flex:1;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid transparent;
  background:#fff;
  cursor:pointer;
  font-weight:700;
  color:var(--muted);
  text-align:center;
}
.tab-btn.active { background:linear-gradient(90deg,var(--accent-1),var(--accent-2)); color:#fff; box-shadow:0 6px 18px rgba(74,163,106,0.12); }

/* panes
   touch-action: pan-y にして「縦スクロールはブラウザに任せる」宣言。
   横スワイプはJSで判定して処理します（preventDefault が必要なときのみ行う）。
*/
.panes { 
  position: relative; 
  overflow: hidden; 
  isolation: isolate; 
  margin-top: 0; 
  touch-action: pan-y;
}
.panes-track {
  display: flex;
  width: auto;
  transition: transform .36s cubic-bezier(.2,.9,.2,1);
  will-change: transform;
}

.tab-pane {
  flex: 0 0 100%;
  padding: 12px 0 0 0;
  min-height: 120px;
  box-sizing: border-box;
  position: relative;
}

.tab-pane input,
.tab-pane textarea {
  /* input上でも横スワイプを検知したいので pan-x を許可 */
  touch-action: pan-x pan-y;
}


#entryDateInput {
  width: clamp(120px, 40vw, 220px);
  min-width: 0;
  max-width: 100%;
  display: inline-block;
  -webkit-appearance: none;
  appearance: none;
  flex-shrink: 1;
  box-sizing: border-box;
}

/* card shadow only for active pane */
.tab-pane .card { box-shadow: none; transition: box-shadow .22s ease, transform .18s ease; }
.tab-pane.pane-active .card { box-shadow: var(--card-shadow); transform: translateZ(0); }

/* inputs, grids */
.good-grid { display:flex; flex-direction:column; gap:8px; width:100%; max-width:100%; }
.input{width:100%;max-width:100%;padding:10px;border-radius:12px;border:1px solid #e6efe6;background:#fbfffb;font-size:0.95rem}
.textarea{width:100%;max-width:100%;padding:10px;border-radius:12px;border:1px solid #e6efe6;background:#fbfffb;height:72px;resize:none}
.btn-primary{background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:white;border:none;padding:10px 14px;border-radius:12px;cursor:pointer}
.small-btn{background:transparent;border:1px solid rgba(36,54,43,0.06);padding:8px 10px;border-radius:10px;cursor:pointer}

/* calendar */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;width:100%;box-sizing:border-box}
.calendar-weekday{font-size:0.85rem;text-align:center;color:#7c947f;padding:6px 0;font-weight:700}
.calendar-cell{background:transparent;border-radius:10px;padding:8px 6px;min-height:64px;display:flex;align-items:flex-start;flex-direction:column;position:relative;border:1px solid transparent;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.calendar-cell:focus{outline:none;box-shadow:0 6px 20px rgba(36,54,43,0.06);transform:translateY(-4px)}
.calendar-day{font-weight:700}
.calendar-dot{position:absolute;right:8px;bottom:8px;font-size:1rem}
.calendar-cell.has-entry{background:linear-gradient(180deg,#f9fffa,#ffffff);border:1px solid rgba(80,160,110,0.06)}

/* history list */
.history-list{max-height:56vh;overflow:auto;padding-right:6px}
.history-card{background:transparent;border-radius:12px;padding:10px;border:1px solid rgba(34,62,46,0.06);margin-bottom:8px}
.history-card h3{margin:0 0 6px 0;font-size:0.95rem}
.history-card ul{padding:0;margin:0;list-style:none}
.history-card li{background:#fbfffb;padding:8px;border-radius:8px;margin-bottom:6px}
.comment-box{margin-top:6px;font-style:italic;color:var(--muted);background:linear-gradient(90deg,rgba(240,255,246,0.8),rgba(255,255,255,0.6));padding:8px;border-radius:8px;border-left:4px solid rgba(163,207,163,0.9)}
.history-card.editing{background:linear-gradient(90deg, rgba(250,250,250,0.98), #fff);box-shadow:0 6px 20px rgba(0,0,0,0.04)}
.edit-input{width:100%;padding:8px;border-radius:8px;border:1px solid #e6efe6;margin-bottom:6px}

/* modal */
.modal{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:2000;pointer-events:none;opacity:0;transition:opacity .22s ease}
.modal.show{pointer-events:all;opacity:1}
.modal-backdrop{position:absolute;inset:0;background:transparent;transition:background .22s ease}
.modal.show .modal-backdrop{background:rgba(6,10,8,0.36)}
.modal-card{background:white;border-radius:14px;padding:12px;width:100%;max-width:720px;box-shadow:0 28px 80px rgba(20,36,28,0.16);transform:translateY(12px);opacity:0;transition:transform .28s ease,opacity .28s;max-height:80vh;overflow:auto}
.modal.show .modal-card{transform:translateY(0);opacity:1}

/* モーダル表示中に背面スクロールを止める */
body.modal-open {
  overflow: hidden;
  touch-action: none; /* モーダル中は背景でのタッチ操作を抑止 */
}

/* helpers */
.snackbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--accent-2);color:white;padding:10px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(50,90,50,0.2);visibility:hidden;opacity:0;transition:opacity .18s, visibility .18s}
.snackbar.show{visibility:visible;opacity:1}
.no-history{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);padding:12px}

/* responsive tweaks */
@media (max-width:720px){
  .history-list{max-height:45vh}
  .input,.textarea{font-size:1rem;padding:12px}
}
</style>
</head>
<body>
<div class="container">
  <header class="appbar" role="banner">
    <div class="app-title">
      <div style="font-size:1.6rem">🍀</div>
      <div>
        <h1>今日の3つのいいこと</h1>
        <div class="stats">
          <div id="streak">連続: 0日</div>
          <div id="total">総いいこと: 0</div>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="themeToggle" type="button" class="small-btn" aria-label="テーマ切替">🌸</button>
    </div>
  </header>

  <!-- tabs -->
  <nav class="tab-nav" role="tablist" aria-label="メインタブ">
    <button class="tab-btn active" role="tab" aria-selected="true" data-tab="today" type="button">🌿 今日</button>
    <button class="tab-btn" role="tab" data-tab="calendar" type="button">📅 カレンダー</button>
    <button class="tab-btn" role="tab" data-tab="history" type="button">📖 履歴</button>
  </nav>

  <!-- panes -->
  <div class="panes" id="panes" aria-live="polite">
    <div class="panes-track" id="panesTrack">
      <!-- today pane -->
      <section id="tab-today" class="tab-pane pane-active" role="tabpanel">
        <div class="card">
          <div style="margin-bottom:10px">
            <input type="date" id="entryDateInput" class="input" />
          </div>

          <div class="good-grid">
            <input id="good1" placeholder="いいこと①" class="input" />
            <input id="good2" placeholder="いいこと②" class="input" />
            <input id="good3" placeholder="いいこと③" class="input" />
          </div>

          <textarea id="comment" class="textarea" placeholder="今日のひとことメモ" style="margin-top:12px"></textarea>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
            <div style="font-size:0.85rem;color:var(--muted)">保存するとカレンダーにマークが付きます 🌸</div>
            <div style="display:flex;gap:8px">
              <button id="saveBtn" class="btn-primary" type="button">保存</button>
            </div>
          </div>
        </div>
      </section>

      <!-- calendar pane -->
      <section id="tab-calendar" class="tab-pane" role="tabpanel">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div id="calendarTitle" style="font-weight:700;color:var(--muted)"></div>
            <div>
              <button id="prevMonthBtn" class="small-btn" type="button">◀</button>
              <button id="nextMonthBtn" class="small-btn" type="button">▶</button>
            </div>
          </div>

          <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="カレンダー"></div>

          <div style="margin-top:12px;font-weight:700;color:var(--muted)">最近の記録</div>
          <div id="recentList" class="history-list" style="padding:10px;margin-top:6px"></div>
        </div>
      </section>

      <!-- history pane -->
      <section id="tab-history" class="tab-pane" role="tabpanel">
        <div class="card">
          <div style="font-weight:700;color:var(--muted);margin-bottom:8px">すべての履歴</div>
          <div id="historyListView" class="history-list" style="padding:10px"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- modal -->
<div id="historyModal" class="modal" aria-hidden="true">
  <div class="modal-backdrop"></div>
  <div class="modal-card" role="dialog" aria-modal="true" tabindex="-1">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <button id="prevDayBtn" class="small-btn" type="button">◀ 前日</button>
      <h3 id="modalDateTitle">📅</h3>
      <button id="nextDayBtn" class="small-btn" type="button">翌日 ▶</button>
    </div>

    <div id="historyList" class="history-list" style="min-height:120px;padding:6px"></div>

    <div style="text-align:right;margin-top:8px">
      <button id="closeModalBtn" class="small-btn" type="button">閉じる</button>
    </div>
  </div>
</div>

<div id="snackbar" class="snackbar" role="status" aria-live="polite">保存しました</div>

<script>
/* ---------- state ---------- */
let selectedDate = new Date();
let modalDate = new Date();
let currentTheme = localStorage.getItem('theme') || 'spring';
const order = ['today','calendar','history'];
let activeIndex = 0;

/* ---------- helpers ---------- */
function pad(n){ return n < 10 ? '0' + n : ''+n; }
function formatDate(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function parseDateKey(key){ const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d); }
function showSnackbar(msg='保存しました'){ const s=document.getElementById('snackbar'); s.textContent=msg; s.classList.add('show'); setTimeout(()=>s.classList.remove('show'),1400); }

/* ---------- theme ---------- */
function applyTheme(t){ currentTheme = t; localStorage.setItem('theme', t); document.body.setAttribute('data-theme', t); const icons = { spring:'🌸', summer:'🌊', autumn:'🍂', winter:'❄️' }; const btn = document.getElementById('themeToggle'); if(btn) btn.textContent = icons[t] || '🌸'; }
function cycleTheme(){ const orderT=['spring','summer','autumn','winter']; let i=orderT.indexOf(currentTheme); i=(i+1)%orderT.length; applyTheme(orderT[i]); showSnackbar('テーマ: '+orderT[i]); }

/* ---------- stats ---------- */
function updateStats(){
  const keys = Object.keys(localStorage).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse();
  let total = 0;
  keys.forEach(k=>{
    try{ const d=JSON.parse(localStorage.getItem(k)); if(!d||!d.goodThings) return; d.goodThings.forEach(x=>{ if(x && x.trim()) total++; }); }catch(e){}
  });
  const tot = document.getElementById('total'); if(tot) tot.textContent = '総いいこと: ' + total;

  let streak=0; let cur=new Date();
  while(true){
    const k=formatDate(cur);
    if(localStorage.getItem(k)){ streak++; cur.setDate(cur.getDate()-1); } else break;
  }
  const st = document.getElementById('streak'); if(st) st.textContent = '連続: ' + streak + '日';
}

/* ---------- save ---------- */
function saveGoodThings(){
  const key = document.getElementById('entryDateInput').value || formatDate(new Date());
  const g1 = document.getElementById('good1').value.trim();
  const g2 = document.getElementById('good2').value.trim();
  const g3 = document.getElementById('good3').value.trim();
  const comment = document.getElementById('comment').value.trim();
  if(!g1 && !g2 && !g3 && !comment){ alert('少なくとも1つ入力してください。'); return; }
  const data = { goodThings:[g1,g2,g3], comment };
  try { localStorage.setItem(key, JSON.stringify(data)); } catch(e){ alert('保存に失敗しました'); return; }

  renderCalendar(); renderRecentList(); renderHistoryList(); updateStats();

  document.getElementById('good1').value=''; document.getElementById('good2').value=''; document.getElementById('good3').value=''; document.getElementById('comment').value='';

  createSeasonalEffect(); showSnackbar('保存しました');
}

/* ---------- calendar ---------- */
function renderCalendar(){
  const grid=document.getElementById('calendarGrid'); if(!grid) return; grid.innerHTML='';
  const year=selectedDate.getFullYear(), month=selectedDate.getMonth();
  const firstDay = new Date(year,month,1), lastDay=new Date(year,month+1,0);
  const weekdays=['日','月','火','水','木','金','土'];
  weekdays.forEach(w=>{ const el=document.createElement('div'); el.className='calendar-weekday'; el.textContent=w; grid.appendChild(el); });

  for(let i=0;i<firstDay.getDay();i++){ const empty=document.createElement('div'); empty.className='calendar-cell empty'; empty.setAttribute('aria-hidden','true'); grid.appendChild(empty); }
  for(let d=1; d<=lastDay.getDate(); d++){
    const date=new Date(year,month,d); const key=formatDate(date);
    const cell=document.createElement('div'); cell.className='calendar-cell'; cell.tabIndex=0; cell.setAttribute('role','button'); cell.setAttribute('aria-label', `${year}年 ${month+1}月 ${d}日 の履歴を開く`);
    const dayNum=document.createElement('div'); dayNum.className='calendar-day'; dayNum.textContent=d; cell.appendChild(dayNum);
    if(localStorage.getItem(key)){ cell.classList.add('has-entry'); const dot=document.createElement('div'); dot.className='calendar-dot'; dot.textContent='🌸'; cell.appendChild(dot); }
    cell.addEventListener('click', ()=> showHistoryModal(date));
    cell.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); showHistoryModal(date); }});
    grid.appendChild(cell);
  }
  const title = document.getElementById('calendarTitle'); if(title) title.textContent = `${year}年 ${month+1}月`;
}

/* ---------- history card ---------- */
function buildHistoryCard(key, data){
  const card=document.createElement('div'); card.className='history-card';
  const h=document.createElement('h3'); h.textContent=key; card.appendChild(h);

  const content=document.createElement('div'); const ul=document.createElement('ul');
  const li1=document.createElement('li'); li1.textContent='① ' + (data.goodThings[0]||''); ul.appendChild(li1);
  const li2=document.createElement('li'); li2.textContent='② ' + (data.goodThings[1]||''); ul.appendChild(li2);
  const li3=document.createElement('li'); li3.textContent='③ ' + (data.goodThings[2]||''); ul.appendChild(li3);
  content.appendChild(ul);
  if(data.comment){ const cm=document.createElement('div'); cm.className='comment-box'; cm.textContent = data.comment; content.appendChild(cm); }
  card.appendChild(content);

  const row=document.createElement('div'); row.style.display='flex'; row.style.justifyContent='flex-end'; row.style.gap='8px'; row.style.marginTop='8px';
  const editBtn=document.createElement('button'); editBtn.type='button'; editBtn.className='small-btn'; editBtn.textContent='編集';
  const delBtn=document.createElement('button'); delBtn.type='button'; delBtn.className='small-btn'; delBtn.textContent='削除';
  row.appendChild(editBtn); row.appendChild(delBtn);
  card.appendChild(row);

  delBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); if(!confirm('この記録を削除してもよいですか？')) return; localStorage.removeItem(key); renderCalendar(); renderRecentList(); renderHistoryList(); updateStats(); const m=document.getElementById('historyModal'); if(m.classList.contains('show')) closeModal(); });

  editBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); if(card.classList.contains('editing')) return; card.classList.add('editing'); content.style.display='none';
    const form=document.createElement('div'); form.style.display='flex'; form.style.flexDirection='column'; form.style.gap='6px';
    const i1=document.createElement('input'); i1.className='edit-input'; i1.value=data.goodThings[0]||''; form.appendChild(i1);
    const i2=document.createElement('input'); i2.className='edit-input'; i2.value=data.goodThings[1]||''; form.appendChild(i2);
    const i3=document.createElement('input'); i3.className='edit-input'; i3.value=data.goodThings[2]||''; form.appendChild(i3);
    const ta=document.createElement('textarea'); ta.className='edit-input'; ta.style.height='72px'; ta.value=data.comment||''; form.appendChild(ta);
    const btnRow=document.createElement('div'); btnRow.style.display='flex'; btnRow.style.justifyContent='flex-end'; btnRow.style.gap='8px';
    const saveBtn=document.createElement('button'); saveBtn.type='button'; saveBtn.className='small-btn'; saveBtn.textContent='保存';
    const cancelBtn=document.createElement('button'); cancelBtn.type='button'; cancelBtn.className='small-btn'; cancelBtn.textContent='キャンセル';
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn); form.appendChild(btnRow);
    card.insertBefore(form, row);

    saveBtn.addEventListener('click', ()=>{
      const updated={ goodThings:[i1.value.trim(), i2.value.trim(), i3.value.trim()], comment: ta.value.trim() };
      try{ localStorage.setItem(key, JSON.stringify(updated)); } catch(e){ alert('保存に失敗しました'); return; }
      const newCard = buildHistoryCard(key, updated);
      card.replaceWith(newCard);
      renderCalendar(); renderRecentList(); renderHistoryList(); updateStats();
      showSnackbar('更新しました');
    });

    cancelBtn.addEventListener('click', ()=>{ form.remove(); content.style.display=''; card.classList.remove('editing'); });
  });

  return card;
}

/* ---------- render lists ---------- */
function renderRecentList(){
  const container=document.getElementById('recentList'); if(!container) return; container.innerHTML='';
  const keys=Object.keys(localStorage).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse().slice(0,12);
  if(keys.length===0){ container.innerHTML='<div class="no-history">まだ履歴がありません。</div>'; return; }
  keys.forEach(k=>{
    try{ const d=JSON.parse(localStorage.getItem(k)); if(!d) return; const el=buildHistoryCard(k,d); el.style.cursor='pointer'; el.addEventListener('click', ()=> showHistoryModal(parseDateKey(k))); container.appendChild(el); } catch(e){}
  });
}

function renderHistoryList(){
  const container=document.getElementById('historyListView'); if(!container) return; container.innerHTML='';
  const keys=Object.keys(localStorage).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse();
  if(keys.length===0){ container.innerHTML='<div class="no-history">まだ履歴がありません。</div>'; return; }
  keys.forEach(k=>{
    try{ const d=JSON.parse(localStorage.getItem(k)); if(!d) return; const el=buildHistoryCard(k,d); container.appendChild(el); } catch(e){}
  });
}

/* ---------- modal ---------- */
function showHistoryModal(date){
  modalDate = new Date(date); const key=formatDate(modalDate);
  document.getElementById('modalDateTitle').textContent = '📅 ' + key;
  const list=document.getElementById('historyList'); list.innerHTML='';
  const raw=localStorage.getItem(key);
  if(raw){ try{ const d=JSON.parse(raw); list.appendChild(buildHistoryCard(key,d)); } catch(e){ list.innerHTML='<div class="no-history">表示できません</div>'; } }
  else list.innerHTML='<div class="no-history">その日は記録がありません</div>';
  const modal=document.getElementById('historyModal'); modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
  document.body.classList.add('modal-open'); // 背景スクロール停止
  document.querySelector('.modal-card').focus();
}
function closeModal(){ const modal=document.getElementById('historyModal'); modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); document.body.classList.remove('modal-open'); }

/* seasonal effect */
function createSeasonalEffect(){
  const map={spring:'🌸', summer:'🌊', autumn:'🍂', winter:'❄️'}; const emoji = map[currentTheme]||'🌸';
  for(let i=0;i<8;i++){
    const el=document.createElement('div'); el.textContent=emoji; el.style.position='fixed'; el.style.left=(6+Math.random()*88)+'%'; el.style.top='-2rem';
    el.style.fontSize=(12+Math.random()*28)+'px'; el.style.pointerEvents='none'; el.style.zIndex=1500; el.style.transition='transform 3s linear, opacity 3s linear';
    document.body.appendChild(el);
    requestAnimationFrame(()=>{ el.style.transform = `translateY(${110 + Math.random()*40}vh) rotate(${Math.random()*360}deg)`; el.style.opacity='0'; });
    setTimeout(()=>el.remove(),3200);
  }
}

/* ---------- slide & swipe (改良版) ---------- */
function moveToTab(name, animate=true){
  const idx = order.indexOf(name);
  if(idx < 0) return;
  const track = document.getElementById('panesTrack');
  const container = document.getElementById('panes');
  const cw = container.clientWidth;

  if(!animate) track.style.transition = 'none';
  else track.style.transition = 'transform .36s cubic-bezier(.2,.9,.2,1)';

  track.style.transform = `translateX(-${idx * cw}px)`;
  activeIndex = idx;

  document.querySelectorAll('.tab-btn').forEach(b=>{ const is=b.dataset.tab===name; b.classList.toggle('active', is); b.setAttribute('aria-selected', is? 'true':'false'); });
  document.querySelectorAll('.tab-pane').forEach((p,i) => p.classList.toggle('pane-active', i === idx) );

  if(name === 'calendar'){ renderCalendar(); renderRecentList(); }
  if(name === 'history'){ renderHistoryList(); }

  if(!animate) setTimeout(()=>{ track.style.transition = 'transform .36s cubic-bezier(.2,.9,.2,1)'; }, 40);
}

// --- 合成クリック抑止（短時間） ---
let _ignoreClickUntil = 0;
const BLOCK_CLICK_MS = 350; // 合成クリックを抑止する時間（ms）

document.addEventListener('click', (ev) => {
  if (Date.now() < _ignoreClickUntil) {
    ev.stopImmediatePropagation();
    ev.preventDefault();
  }
}, true); // capture = true（先に止める）

// ---- 改良版 enableSwipe（この関数で touchstart/touchmove/touchend を扱う） ----
function enableSwipe() {
  const container = document.getElementById('panes');
  const track = document.getElementById('panesTrack');
  if (!container || !track) return;

  let startX = 0, startY = 0;
  let currentTranslate = 0;
  let isHorizontal = null; // null=未判定, true=横, false=縦
  let moved = false;
  let startTarget = null;

  const swipeThreshold = 12; // 判定開始に必要な最小px
  const moveThreshold = container.clientWidth * 0.22;
  const slowFactor = 0.7;

  container.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTarget = e.target;
    currentTranslate = -activeIndex * container.clientWidth;
    isHorizontal = null;
    moved = false;
    track.style.transition = 'none';
  }, { passive: true });

  container.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;

    // 判定未確定なら横/縦を判定
    if (isHorizontal === null) {
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > swipeThreshold) {
        isHorizontal = true;
      } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > swipeThreshold) {
        isHorizontal = false;
      } else {
        return; // まだ判断できない小さな動き
      }
    }

    if (isHorizontal) {
      // 横スワイプ扱いのときのみ preventDefault してブラウザ水平動作を止める
      e.preventDefault();
      track.style.transform = `translateX(${currentTranslate + dx * slowFactor}px)`;
      moved = true;
    } else {
      // 縦スクロール判定 -> ブラウザに任せる
      return;
    }
  }, { passive: false });

  container.addEventListener('touchend', (e) => {
    const touch = (e.changedTouches && e.changedTouches[0]) || null;
    const dx = touch ? (touch.clientX - startX) : 0;
    track.style.transition = 'transform .36s cubic-bezier(.2,.9,.2,1)';

    if (moved && isHorizontal) {
      // 実際にスワイプと判定された場合はタブ切替
      if (dx < -moveThreshold && activeIndex < order.length - 1) moveToTab(order[activeIndex + 1]);
      else if (dx > moveThreshold && activeIndex > 0) moveToTab(order[activeIndex - 1]);
      else moveToTab(order[activeIndex]);

      // スワイプ直後の合成クリックをブロック
      _ignoreClickUntil = Date.now() + BLOCK_CLICK_MS;
    } else {
      // スワイプではない（＝タップ or 縦スクロール）
      // 縦スクロールと判定された場合は合成クリックを少し長めに抑止しておく
      if (isHorizontal === false) {
        _ignoreClickUntil = Math.max(_ignoreClickUntil, Date.now() + BLOCK_CLICK_MS);
        moveToTab(order[activeIndex]);
      } else {
        // 小さな移動 = タップとして補償する（elementFromPoint で正しい要素を取り、**インタラクティブ要素のみ**クリックする）
        const clientX = touch ? touch.clientX : startX;
        const clientY = touch ? touch.clientY : startY;
        let el = document.elementFromPoint(clientX, clientY) || startTarget;

        if (el) {
          // ここで「クリックして良い要素」を限定する（カード本体などは除外）
          const clickable = el.closest('button, a, input, label, [role="button"], [data-clickable]');

          if (clickable) {
            // label の場合は関連コントロールにフォワード
            if (clickable.tagName === 'LABEL' && clickable.htmlFor) {
              const ctrl = document.getElementById(clickable.htmlFor);
              if (ctrl && typeof ctrl.click === 'function') ctrl.click();
            } else {
              // ネイティブの click イベントを模した MouseEvent を発火
              const evClick = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true
              });
              clickable.dispatchEvent(evClick);
            }
            // 自前で click を発火したので、後続のネイティブ合成クリックは抑止
            _ignoreClickUntil = Date.now() + BLOCK_CLICK_MS;
          }
          // clickable が見つからなければ何もしない（カード本体への誤クリックを防ぐ）
        }
        moveToTab(order[activeIndex]);
      }
    }

    // reset
    startX = startY = 0;
    isHorizontal = null;
    moved = false;
    startTarget = null;
  }, { passive: true });

  container.addEventListener('touchcancel', () => moveToTab(order[activeIndex]));
}

/* ---------- init ---------- */
window.addEventListener('DOMContentLoaded', ()=>{
  applyTheme(currentTheme);
  document.getElementById('entryDateInput').value = formatDate(new Date());

  // tab buttons
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.addEventListener('click', ()=> moveToTab(btn.dataset.tab));
  });

  // initial setup - position using px
  moveToTab('today', false);
  enableSwipe();

  // save & nav
  document.getElementById('saveBtn').addEventListener('click', saveGoodThings);
  document.getElementById('prevMonthBtn').addEventListener('click', ()=>{ selectedDate.setMonth(selectedDate.getMonth()-1); renderCalendar(); });
  document.getElementById('nextMonthBtn').addEventListener('click', ()=>{ selectedDate.setMonth(selectedDate.getMonth()+1); renderCalendar(); });

  // modal controls
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.querySelector('#historyModal .modal-backdrop').addEventListener('click', closeModal);
  document.getElementById('prevDayBtn').addEventListener('click', ()=>{ modalDate.setDate(modalDate.getDate()-1); showHistoryModal(modalDate); });
  document.getElementById('nextDayBtn').addEventListener('click', ()=>{ modalDate.setDate(modalDate.getDate()+1); showHistoryModal(modalDate); });

  // theme toggle
  document.getElementById('themeToggle').addEventListener('click', cycleTheme);

  // keyboard: Esc closes modal
  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape'){ const modal=document.getElementById('historyModal'); if(modal.classList.contains('show')) closeModal(); } });

  // initial render
  renderCalendar(); renderRecentList(); renderHistoryList(); updateStats();

  // on resize, reposition slider (exact pixel)
  window.addEventListener('resize', ()=>{ moveToTab(order[activeIndex], false); });
});
</script>
